      #home-feed-container {

      .course-dashboard {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;

      .course-card {
        min-width: 0;

        background: white;
      }
      #left-column {
        display: none;
      }
      footer {
        padding: 20px;
      }
      @media (max-width: 760px) {
        #main-content-wrapper {
          width: calc(100% - 24px);
          grid-template-columns: minmax(0, 1fr);
          margin: 12px;
        }
        #right-column {
          width: 100%;
        }
        .course-dashboard {
